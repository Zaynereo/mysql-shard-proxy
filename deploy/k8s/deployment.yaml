apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-shard-proxy
  namespace: mysql-shard-proxy
  labels:
    app.kubernetes.io/name: mysql-shard-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-shard-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-shard-proxy
    spec:
      serviceAccountName: mysql-shard-proxy
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql-shard-proxy
          image: mysql-shard-proxy:latest
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/mysql-shard-proxy/config.yaml"]
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: PROXY_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-shard-proxy
                  key: proxy-password
            - name: MYSQL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-shard-proxy
                  key: mysql-password
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/mysql-shard-proxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mysql-shard-proxy
        - name: tmp
          emptyDir: {}
